<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <!-- CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
  <!-- bootstrap : CSS 프레임 워크
  프레임 워크 : 이미 짜여진 소스코드
  -장점 : 그냥 가져와서 쓰거나, 코드를 수정하거나 - 추가해서 사용할 수 있다. -->
  
  <!-- bootstrap 왜 쓸까? : 이미 짜여진 CSS 소스코드이기 때문에 빠르고 편하게 사용할 수 있다. -->
  
  <!-- 사용방법 2가지
  1. 공식문서에 CDN을 복사 붙여넣기 
  (단점 : CSS 수정 불가능, 장점 : 빠르고 쉽다)
  2. bootstrap.css 파일과 bootstrap.js 파일을 다운로드 받는다.
  (장점 : CSS를 원하는대로 수정할 수 있다.) -->

  <!-- CDN : 분산 컨텐츠 네트워크 content delivery network -->
  <!-- CDN을 쓰는 이유 : 물리적인 거리문제를 해결 할 수 있다. -->

  <h1>h1. Bootstrap heading</h1>
  <h2>h2. Bootstrap heading</h2>
  <h3>h3. Bootstrap heading</h3>
  <h4>h4. Bootstrap heading</h4>
  <h5>h5. Bootstrap heading</h5>
  <h6>h6. Bootstrap heading</h6>

  <p class="h1">h1. Bootstrap heading</p>
  <p class="h2">h2. Bootstrap heading</p>
  <p class="h3">h3. Bootstrap heading</p>
  <p class="h4">h4. Bootstrap heading</p>
  <p class="h5">h5. Bootstrap heading</p>
  <p class="h6">h6. Bootstrap heading</p>
  <!-- JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
